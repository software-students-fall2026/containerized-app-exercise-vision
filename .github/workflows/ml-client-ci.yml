name: ML Client CI

on:
  push:
    branches: [main, master, feature/gesture]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: machine-learning-client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install pipenv==2024.4.0
          pipenv sync --dev

      - name: Check formatting
        run: pipenv run black --check .

      - name: Run Pylint
        run: pipenv run pylint client.py gesture_detector.py tests/

      - name: Run tests with coverage
        run: |
          pipenv run python -m pytest tests/ -v \
            --cov=client \
            --cov=gesture_detector \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t simon-ml-client .