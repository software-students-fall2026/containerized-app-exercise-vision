<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Camera Challenge</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Welcome Screen -->
    <section id="welcome-screen" class="screen">
        <h1>LET'S PLAY<br><span>SIMON SAYS!</span></h1>

        <p>Follow the commands. Strike a pose.</p>

        <button id="play-button">PLAY</button>

        <p class="game-info">5 Rounds • Camera Required</p>

        <p id="camera-error" role="alert"></p>
    </section>

    <section id="camera-screen" class="screen hidden">

        <h2 id="game-heading">Get Ready!</h2>

        <div class="camera-container">

            <video id="webcam" autoplay playsinline muted></video>

            <!-- Countdown Overlay -->
            <div id="countdown-overlay">
                <span id="countdown-number">3</span>
            </div>

        </div>

        <p id="game-instruction">
            Make sure your upper body is visible.
        </p>

    </section>

    <script src="{{ url_for('static', filename='game.js') }}"></script>

</body>
</html>
